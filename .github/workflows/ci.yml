name: CI

# 推送到 main 或提交 PR 时运行冒烟自检
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    name: Smoke test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run smoke
